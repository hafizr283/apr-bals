name: Documentation evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check archived evidence (CPU only)
        run: python scripts/verify_paper_evidence.py --check
      - name: Exercise evidence failures and declared gaps
        run: python -m unittest discover -s tests -p 'test_evidence.py'
